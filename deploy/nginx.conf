upstream mcp_secure {
    server 127.0.0.1:8766;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate /etc/nginx/ssl/mcp.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/mcp.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /sse {
        proxy_pass http://mcp_secure/sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /message {
        proxy_pass http://mcp_secure/message;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Rate limiting: max 20 burst with no delay
        limit_req zone=mcp_limit burst=20 nodelay;
        # Connection limiting: max 10 concurrent per IP
        limit_conn mcp_conn 10;
    }
}

# Health check endpoint (optional, unprotected)
server {
    listen 80;
    server_name mcp.example.com;
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
